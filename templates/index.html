<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            background: url('/static/bg.jpg') no-repeat center center;
            background-size: cover;
            animation: slowZoom 20s ease-in-out infinite alternate;
        }
        @keyframes slowZoom {
            0% { background-size: 100%; }
            100% { background-size: 120%; }
        }
        .envelope {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .envelope:hover { transform: scale(1.2); }
        .hidden { display: none; }
        .card {
            text-align: center;
            color: white;
            animation: fadeIn 1s ease;
        }
        .card h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card p {
            font-size: 1.1rem;
            color: #fff;
            margin-top: 10px;
            min-height: 1.5em;
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall linear forwards;
        }
        .floating-emoji {
            position: fixed;
            top: -40px;
            animation: floatDown linear forwards;
            opacity: 0.8;
        }
        .firecracker {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: burst 0.8s ease-out forwards;
        }
        .balloon {
            position: fixed;
            bottom: -60px;
            width: 30px;
            height: 40px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: rise linear forwards;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            width: 1px;
            height: 20px;
            background: rgba(255,255,255,0.5);
        }
        .star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes burst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
        @keyframes floatDown {
            to { transform: translateY(100vh) rotate(360deg); }
        }
        @keyframes rise {
            to { transform: translateY(-110vh) rotate(10deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="envelope" id="envelope" onclick="reveal()">&#127873;</div>
    <div class="card hidden" id="card">
        <h1>Happy Birthday, RINGMA</h1>
        <p id="typewriter"></p>
    </div>

    <audio id="bgm" loop>
        <source src="/static/shimmer.mp3" type="audio/mpeg">
    </audio>

    <script>
        const message = "May this special day mark the beginning of a year filled with good health, lasting peace, and abundant happiness. I pray that you are blessed with the wisdom and strength to overcome every challenge, turning obstacles into opportunities for growth and success.
May your heart be filled with joy and your life with prosperity as you navigate the year ahead. I ask for divine protection over your coming and going, ensuring that you are surrounded by love, guided by grace, and equipped with the resilience to solve any problem that arises.";
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < message.length) {
                document.getElementById("typewriter").textContent += message.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 60);
            }
        }

        function reveal() {
            document.getElementById("envelope").classList.add("hidden");
            document.getElementById("card").classList.remove("hidden");
            document.getElementById("bgm").play();
            setTimeout(typeWriter, 800);

            const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#54a0ff"];
            for (let i = 0; i < 60; i++) {
                const c = document.createElement("div");
                c.className = "confetti";
                c.style.left = Math.random() * 100 + "vw";
                c.style.background = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 1) + "s";
                c.style.animationDelay = Math.random() * 0.5 + "s";
                document.body.appendChild(c);
            }

            const emojis = ["\u{1F9F8}", "\u{1F381}", "\u{1F380}", "\u{2764}\u{FE0F}", "\u{1F382}", "\u{1F495}", "\u{1F300}", "\u{2728}"];
            for (let i = 0; i < 20; i++) {
                const e = document.createElement("div");
                e.className = "floating-emoji";
                e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                e.style.left = Math.random() * 90 + "vw";
                e.style.fontSize = (Math.random() * 20 + 20) + "px";
                e.style.animationDuration = (Math.random() * 3 + 3) + "s";
                e.style.animationDelay = Math.random() * 2 + "s";
                document.body.appendChild(e);
            }

            function firecrackerBurst() {
                const x = Math.random() * 80 + 10;
                const y = Math.random() * 60 + 10;
                const burstColors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#ffbe76", "#7bed9f"];
                const color = burstColors[Math.floor(Math.random() * burstColors.length)];
                for (let i = 0; i < 12; i++) {
                    const p = document.createElement("div");
                    p.className = "firecracker";
                    const angle = (i / 12) * 360;
                    const dist = Math.random() * 60 + 30;
                    p.style.left = x + "vw";
                    p.style.top = y + "vh";
                    p.style.background = color;
                    p.style.setProperty("--tx", Math.cos(angle * Math.PI / 180) * dist + "px");
                    p.style.setProperty("--ty", Math.sin(angle * Math.PI / 180) * dist + "px");
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 800);
                }
            }
            for (let i = 0; i < 8; i++) {
                setTimeout(firecrackerBurst, i * 600);
            }
            setInterval(firecrackerBurst, 2000);

            const balloonColors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#7bed9f", "#a29bfe"];
            function spawnBalloon() {
                const b = document.createElement("div");
                b.className = "balloon";
                b.style.left = Math.random() * 90 + "vw";
                b.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                b.style.animationDuration = (Math.random() * 4 + 5) + "s";
                document.body.appendChild(b);
                setTimeout(() => b.remove(), 9000);
            }
            for (let i = 0; i < 6; i++) {
                setTimeout(spawnBalloon, i * 800);
            }
            setInterval(spawnBalloon, 2500);

            for (let i = 0; i < 30; i++) {
                const s = document.createElement("div");
                s.className = "star";
                s.style.left = Math.random() * 100 + "vw";
                s.style.top = Math.random() * 40 + "vh";
                s.style.animationDelay = Math.random() * 2 + "s";
                s.style.animationDuration = (Math.random() * 1.5 + 1) + "s";
                document.body.appendChild(s);
            }
        }
    </script>
</body>
</html>
